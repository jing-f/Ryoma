<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>一级水平导航菜单</title>
    <style>
*{
    margin: 0;
    padding: 0;
    list-style: none;
}
.nav>ul{
    display: flex;
}
.nav>ul>li{
    padding:12px 18px;
}
.nav>ul>li>a{
    color:#000;
    text-decoration:none;
    font-size:20px;
}
.nav>ul>li:hover{
    background:#333;
}
.nav>ul>li:hover>a{
    color:#fff;
}
    </style>
</head>
<body>
<p>欢迎访问湖南文理学院</p>
<div class="nav">
    <ul>
        <li><a href="#">首页</a></li>
        <li><a href="#">教学院(部)</a></li>
        <li><a href="#">党群机构</a></li>
        <li><a href="#">行政教辅机构</a></li>
        <li><a href="#">教学科研</a></li>
        <li><a href="#">招生就业</a></li>
        <li><a href="#">国际交流</a></li>
        <li><a href="#">数字图书馆</a></li>
    </ul>
</div>
</body>
</html>
